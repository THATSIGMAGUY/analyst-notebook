<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <title>Analyst's Notebook</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Anti-FOUC: read persisted theme before CSS applies. Default = tactical dark. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('analyst-notebook.theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* file:// can throw — ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
